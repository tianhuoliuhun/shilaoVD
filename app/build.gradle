plugins {
    id 'com.android.application'
}

// 发布签名：读本地 keystore.properties（不入库，.gitignore 已挡；缺失时 release 退化为未签名）
def keystorePropsFile = rootProject.file('keystore.properties')
def keystoreProps = new Properties()
def hasKeystore = keystorePropsFile.exists()
if (hasKeystore) {
    keystoreProps.load(new FileInputStream(keystorePropsFile))
}

// myDVQ —— 极简上下滑短视频播放器（只有「推荐」一条流、画面零文字零按钮）
//
// 相对原基座（腕上音符）删掉的构建内容：
//   - devdiag 变体（"真机验证专用"构建，随它的诊断/登录态需求一起移除）
//   - assembleRelease 的 debuggable 卫生闸门（本项目不发那种诊断包）
android {
    namespace 'com.laorendouyin.app'
    compileSdk 36

    defaultConfig {
        applicationId 'com.laorendouyin.app'
        minSdk 14
        targetSdk 36
        // minSdk 14 必需：Android 5.0（API 20）及以下没有系统级 multidex，
        // 方法数超过 64K 就必须显式开启（配合 DyApp 里的 MultiDex.install）
        multiDexEnabled true
        versionCode 11
        versionName '1.10'
    }

    signingConfigs {
        release {
            if (hasKeystore) {
                storeFile rootProject.file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasKeystore) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    testOptions {
        // 联网冒烟测试（FeedFetchTest）按需开启：gradlew test -Dnetwork.test=true
        unitTests.all {
            systemProperty 'network.test', System.getProperty('network.test', 'false')
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.9.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    // minSdk 14 必需：API 20 及以下要手动装 multidex
    implementation 'androidx.multidex:multidex:2.0.1'

    // DKVideoPlayer（源码内嵌，Apache-2.0）：唯一的播放内核
    implementation project(':dkplayer-java')
    implementation project(':dkplayer-ui')
    implementation project(':dkplayer-videocache')

    // 图片加载（封面图）：Glide 4.16.0
    // ⚠️ group 是 com.github.bumptech.glide —— 原基座记录过：写成 com.bumptech.glide 实测 404
    implementation 'com.github.bumptech.glide:glide:4.16.0'

    // a_bogus 签名：App 内嵌 Rhino 跑 ylcangel/douyin_sign 的 JS（Apache-2.0）
    implementation 'org.mozilla:rhino:1.7.7.2'
    // HTTP 客户端（Feed 数据层）
    implementation 'com.squareup.okhttp3:okhttp:3.12.13'
    // JSON 解析（纯 Java 可单测）
    implementation 'com.google.code.gson:gson:2.11.0'

    // 播放内核：IJK（B 站 ijkplayer，底层 FFmpeg）
    // 为什么加：老设备（尤其 Android 4.x）上系统 MediaPlayer 对容器/编码挑得厉害 ——
    // 同一个视频新手机能放、老人那台老机器就是黑屏。IJK 软硬解通吃，是"让安卓 4 跑起来"的关键牌。
    // ⚠️ 它带 native so → 本项目从此**不再是纯 Java**，APK 里开始有 lib/ 目录，也就有了 ABI 之分。
    //    必须带上 armeabi-v7a（Android 4 的绝对主力），否则老设备装了也播不了。
    implementation 'tv.danmaku.ijk.media:ijkplayer-java:0.8.8'
    implementation 'tv.danmaku.ijk.media:ijkplayer-armv7a:0.8.8'
    implementation 'tv.danmaku.ijk.media:ijkplayer-arm64:0.8.8'
    implementation 'tv.danmaku.ijk.media:ijkplayer-x86:0.8.8'
    implementation 'tv.danmaku.ijk.media:ijkplayer-x86_64:0.8.8'

    // Conscrypt：给老系统换一套现代 TLS 实现（自带 BoringSSL）
    // 为什么必须加：Android 4.4 自带的 OpenSSL 1.0.1 太老，握手时服务器直接回
    //   "tlsv1 alert protocol version"（抖音这类现代服务早已不收老协议），
    //   应用层光设 enabledProtocols 改不了底层 —— 只能把整个 TLS provider 换掉。
    implementation 'org.conscrypt:conscrypt-android:2.5.2'

    // ExoPlayer 2.18：**老系统上真正能播的那个内核**
    // 为什么它行、IJK 不行：ExoPlayer 的网络层走 Java 的 HttpURLConnection，
    // 能吃到我们为老系统装的 Conscrypt（现代 TLS）；而 IJK/系统 MediaPlayer 走 native，
    // 各自用各自的老 TLS 栈，Conscrypt 管不着 —— 实测它们握手都被服务器拒。
    // ⚠️ 必须锁 2.18 这条线：ExoPlayer 2.19 起 minSdk 提到 21，我们这个项目是 14。
    implementation 'com.google.android.exoplayer:exoplayer-core:2.18.7'

    // 农历与节日：顶部信息栏要显示"今日节日"，春节/中秋这些必须查农历
    // （纯 Java 实现，无 native、无 java.time 依赖，minSdk 14 可用）
    implementation 'cn.6tail:lunar:1.7.4'

    testImplementation 'junit:junit:4.13.2'
}
