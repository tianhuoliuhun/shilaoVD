plugins {
    id 'com.android.application'
}

// 发布签名：读本地 keystore.properties（不入库，.gitignore 已挡；缺失时 release 退化为未签名）
def keystorePropsFile = rootProject.file('keystore.properties')
def keystoreProps = new Properties()
def hasKeystore = keystorePropsFile.exists()
if (hasKeystore) {
    keystoreProps.load(new FileInputStream(keystorePropsFile))
}

// myDVQ —— 极简上下滑短视频播放器（只有「推荐」一条流、画面零文字零按钮）
//
// 相对原基座（腕上音符）删掉的构建内容：
//   - devdiag 变体（"真机验证专用"构建，随它的诊断/登录态需求一起移除）
//   - assembleRelease 的 debuggable 卫生闸门（本项目不发那种诊断包）
android {
    namespace 'com.laorendouyin.app'
    compileSdk 36

    defaultConfig {
        applicationId 'com.laorendouyin.app'
        minSdk 14
        targetSdk 36
        // minSdk 14 必需：Android 5.0（API 20）及以下没有系统级 multidex，
        // 方法数超过 64K 就必须显式开启（配合 DyApp 里的 MultiDex.install）
        multiDexEnabled true
        versionCode 17
        versionName '1.16'
    }

    // ============================================================
    // 内容源变体（2026-10-14）：**同一套代码出两个 APK**
    //   · standard —— 普通版：抖音「推荐」流（tab/feed）
    //   · channel  —— 频道专版：只刷某一个频道（channel/feed + tag_id）
    //
    // ⚠️ 为什么频道必须换端点：实测推荐流的 `tag_id` 参数**无效**（放进去也不换内容），
    //    只有 `/aweme/v1/web/channel/feed/` 认它（见 docs/FEASIBILITY_PROBE.md）。
    // ⚠️ 为什么两个包名不同：要让它们能被**同时安装**、各自独立升级；
    //    而 standard 保持原 applicationId 不变，老用户才能继续覆盖升级。
    // 🔧 想换频道：只改下面 channel 里的 CHANNEL_TAG_ID / CHANNEL_NAME 两个值即可，
    //    17 个可选频道的 id 见 docs/FEASIBILITY_PROBE.md。
    // ============================================================
    flavorDimensions 'content'
    productFlavors {
        standard {
            dimension 'content'
            buildConfigField 'String', 'CHANNEL_TAG_ID', '""'
            buildConfigField 'String', 'CHANNEL_NAME', '""'
        }
        // ---- 老人专版：推荐流 + 6 个频道 轮询（2026-10-14）----
        // 来源分两类：
        //   ① 按实测内容挑的（probe/probe_elder.js 各抓 20 条对比）——
        //      三农 —— 乡村生活/赶海/地方美食/非遗手艺，画面导向、几乎不需要文字
        //      音乐 —— 经典港乐/老歌，老人的强需求，且能"只听不看"
        //      美食 —— 吃播直观，无需认字
        //      动物 —— 萌宠与自然，治愈系
        //   ② 按使用者要求加入的 ——
        //      亲子(300217) —— 家庭日常；实测偏年轻父母向，但家庭题材老人也爱看
        //      旅行(300221) —— 各地风土人情；实测偏博主向，但风景见闻直观
        // 未选：体育（偏国际年轻赛事）、
        //       知识/公开课/汽车/游戏/二次元/美妆/小剧场/生活vlog（依赖文字或偏年轻人群）
        laoren {
            dimension 'content'
            applicationIdSuffix '.laoren'
            buildConfigField 'String', 'CHANNEL_TAG_ID', '"recommend,300219,300209,300204,300220,300217,300221"'
            buildConfigField 'String', 'CHANNEL_NAME', '"精选"'
        }

        // ---- 以下 17 个：每个频道一个独立包（2026-10-14）----
        // 全部 17 个频道实测 `channel/feed` 均可用（各返回 10 条，见 probe/probe_all_channels.js）。
        // 换/增频道只要照抄一块，并补一个 app/src/<flavor>/res/values/strings.xml 覆盖应用名。
        quanbu {
            dimension 'content'
            applicationIdSuffix '.quanbu'
            buildConfigField 'String', 'CHANNEL_TAG_ID', '"0"'
            buildConfigField 'String', 'CHANNEL_NAME', '"全部"'
        }
        gongkaike {
            dimension 'content'
            applicationIdSuffix '.gongkaike'
            buildConfigField 'String', 'CHANNEL_TAG_ID', '"100000"'
            buildConfigField 'String', 'CHANNEL_NAME', '"公开课"'
        }
        meishi {
            dimension 'content'
            applicationIdSuffix '.meishi'
            buildConfigField 'String', 'CHANNEL_TAG_ID', '"300204"'
            buildConfigField 'String', 'CHANNEL_NAME', '"美食"'
        }
        youxi {
            dimension 'content'
            applicationIdSuffix '.youxi'
            buildConfigField 'String', 'CHANNEL_TAG_ID', '"300205"'
            buildConfigField 'String', 'CHANNEL_NAME', '"游戏"'
        }
        erciyuan {
            dimension 'content'
            applicationIdSuffix '.erciyuan'
            buildConfigField 'String', 'CHANNEL_TAG_ID', '"300206"'
            buildConfigField 'String', 'CHANNEL_NAME', '"二次元"'
        }
        tiyu {
            dimension 'content'
            applicationIdSuffix '.tiyu'
            buildConfigField 'String', 'CHANNEL_TAG_ID', '"300207"'
            buildConfigField 'String', 'CHANNEL_NAME', '"体育"'
        }
        yinyue {
            dimension 'content'
            applicationIdSuffix '.yinyue'
            buildConfigField 'String', 'CHANNEL_TAG_ID', '"300209"'
            buildConfigField 'String', 'CHANNEL_NAME', '"音乐"'
        }
        zhishi {
            dimension 'content'
            applicationIdSuffix '.zhishi'
            buildConfigField 'String', 'CHANNEL_TAG_ID', '"300213"'
            buildConfigField 'String', 'CHANNEL_NAME', '"知识"'
        }
        xiaojuchang {
            dimension 'content'
            applicationIdSuffix '.xiaojuchang'
            buildConfigField 'String', 'CHANNEL_TAG_ID', '"300214"'
            buildConfigField 'String', 'CHANNEL_NAME', '"小剧场"'
        }
        yingshi {
            dimension 'content'
            applicationIdSuffix '.yingshi'
            buildConfigField 'String', 'CHANNEL_TAG_ID', '"300215"'
            buildConfigField 'String', 'CHANNEL_NAME', '"影视"'
        }
        shenghuo {
            dimension 'content'
            applicationIdSuffix '.shenghuo'
            buildConfigField 'String', 'CHANNEL_TAG_ID', '"300216"'
            buildConfigField 'String', 'CHANNEL_NAME', '"生活vlog"'
        }
        qinzi {
            dimension 'content'
            applicationIdSuffix '.qinzi'
            buildConfigField 'String', 'CHANNEL_TAG_ID', '"300217"'
            buildConfigField 'String', 'CHANNEL_NAME', '"亲子"'
        }
        qiche {
            dimension 'content'
            applicationIdSuffix '.qiche'
            buildConfigField 'String', 'CHANNEL_TAG_ID', '"300218"'
            buildConfigField 'String', 'CHANNEL_NAME', '"汽车"'
        }
        sannong {
            dimension 'content'
            applicationIdSuffix '.sannong'
            buildConfigField 'String', 'CHANNEL_TAG_ID', '"300219"'
            buildConfigField 'String', 'CHANNEL_NAME', '"三农"'
        }
        dongwu {
            dimension 'content'
            applicationIdSuffix '.dongwu'
            buildConfigField 'String', 'CHANNEL_TAG_ID', '"300220"'
            buildConfigField 'String', 'CHANNEL_NAME', '"动物"'
        }
        lvxing {
            dimension 'content'
            applicationIdSuffix '.lvxing'
            buildConfigField 'String', 'CHANNEL_TAG_ID', '"300221"'
            buildConfigField 'String', 'CHANNEL_NAME', '"旅行"'
        }
        meizhuang {
            dimension 'content'
            applicationIdSuffix '.meizhuang'
            buildConfigField 'String', 'CHANNEL_TAG_ID', '"300222"'
            buildConfigField 'String', 'CHANNEL_NAME', '"美妆穿搭"'
        }
    }

    // ⚠️ AGP 8 起 BuildConfig 默认不生成，用 buildConfigField 必须显式打开，
    //    否则编译报 "cannot find symbol: class BuildConfig"
    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        release {
            if (hasKeystore) {
                storeFile rootProject.file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasKeystore) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // 发布构建里的 lintVital* 任务实测会长时间挂起（20 分钟量级）且与出包无关。
    // ⚠️ flavor 化之后无法再用命令行的 `-x lintVitalRelease`（要写全 18 个任务名），
    //    所以在这里一次性关掉；需要 lint 时单独跑 `gradle :app:lintStandardRelease` 之类。
    lint {
        checkReleaseBuilds = false
    }

    testOptions {
        // 联网冒烟测试（FeedFetchTest）按需开启：gradlew test -Dnetwork.test=true
        unitTests.all {
            systemProperty 'network.test', System.getProperty('network.test', 'false')
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.9.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    // minSdk 14 必需：API 20 及以下要手动装 multidex
    implementation 'androidx.multidex:multidex:2.0.1'

    // DKVideoPlayer（源码内嵌，Apache-2.0）：唯一的播放内核
    implementation project(':dkplayer-java')
    implementation project(':dkplayer-ui')
    implementation project(':dkplayer-videocache')

    // 图片加载（封面图）：Glide 4.16.0
    // ⚠️ group 是 com.github.bumptech.glide —— 原基座记录过：写成 com.bumptech.glide 实测 404
    implementation 'com.github.bumptech.glide:glide:4.16.0'

    // a_bogus 签名：App 内嵌 Rhino 跑 ylcangel/douyin_sign 的 JS（Apache-2.0）
    implementation 'org.mozilla:rhino:1.7.7.2'
    // HTTP 客户端（Feed 数据层）
    implementation 'com.squareup.okhttp3:okhttp:3.12.13'
    // JSON 解析（纯 Java 可单测）
    implementation 'com.google.code.gson:gson:2.11.0'

    // 播放内核：IJK（B 站 ijkplayer，底层 FFmpeg）
    // 为什么加：老设备（尤其 Android 4.x）上系统 MediaPlayer 对容器/编码挑得厉害 ——
    // 同一个视频新手机能放、老人那台老机器就是黑屏。IJK 软硬解通吃，是"让安卓 4 跑起来"的关键牌。
    // ⚠️ 它带 native so → 本项目从此**不再是纯 Java**，APK 里开始有 lib/ 目录，也就有了 ABI 之分。
    //    必须带上 armeabi-v7a（Android 4 的绝对主力），否则老设备装了也播不了。
    implementation 'tv.danmaku.ijk.media:ijkplayer-java:0.8.8'
    implementation 'tv.danmaku.ijk.media:ijkplayer-armv7a:0.8.8'
    implementation 'tv.danmaku.ijk.media:ijkplayer-arm64:0.8.8'
    implementation 'tv.danmaku.ijk.media:ijkplayer-x86:0.8.8'
    implementation 'tv.danmaku.ijk.media:ijkplayer-x86_64:0.8.8'

    // Conscrypt：给老系统换一套现代 TLS 实现（自带 BoringSSL）
    // 为什么必须加：Android 4.4 自带的 OpenSSL 1.0.1 太老，握手时服务器直接回
    //   "tlsv1 alert protocol version"（抖音这类现代服务早已不收老协议），
    //   应用层光设 enabledProtocols 改不了底层 —— 只能把整个 TLS provider 换掉。
    implementation 'org.conscrypt:conscrypt-android:2.5.2'

    // ExoPlayer 2.18：**老系统上真正能播的那个内核**
    // 为什么它行、IJK 不行：ExoPlayer 的网络层走 Java 的 HttpURLConnection，
    // 能吃到我们为老系统装的 Conscrypt（现代 TLS）；而 IJK/系统 MediaPlayer 走 native，
    // 各自用各自的老 TLS 栈，Conscrypt 管不着 —— 实测它们握手都被服务器拒。
    // ⚠️ 必须锁 2.18 这条线：ExoPlayer 2.19 起 minSdk 提到 21，我们这个项目是 14。
    implementation 'com.google.android.exoplayer:exoplayer-core:2.18.7'

    // 农历与节日：顶部信息栏要显示"今日节日"，春节/中秋这些必须查农历
    // （纯 Java 实现，无 native、无 java.time 依赖，minSdk 14 可用）
    implementation 'cn.6tail:lunar:1.7.4'

    testImplementation 'junit:junit:4.13.2'
}
